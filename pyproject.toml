[project]
name = "karyo"
version = "0.3.0"
description = "A minimal Python coding-agent harness with local tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.2.2",
    "huggingface-hub==1.26.0",
    "mcp>=1.28.1,<2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
karyo = "cli:run"

[tool.setuptools]
py-modules = ["cli", "inference", "harness_auth", "token_usage", "trace_viewer", "context_builder"]
packages = ["memory", "tools", "karyo_config"]

[tool.setuptools.package-data]
karyo_config = ["defaults.json"]
